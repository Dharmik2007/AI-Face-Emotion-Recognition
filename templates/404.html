{% extends "base.html" %}

{% block title %}Page Not Found (404) | FER-CNN{% endblock %}

{% block content %}
<div class="container error-page">
    <div class="card error-card">
        <h1 class="error-code">404</h1>
        <h2>Page Not Found</h2>
        <p class="text-muted">The requested URL was not found on this facial expression recognition server.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary" style="margin-top: 1.5rem;">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
